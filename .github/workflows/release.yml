name: Package Release
run-name: Packaging Peakaboo ${{ github.ref_name }} for ${{ inputs.release_type == 'dev' && 'Development' || 'Release' }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (release or dev)'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - dev

permissions:
  contents: read

jobs:
  build-jar:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn -B package --file pom.xml

    - name: Move Jars to Upload Location
      run: |
        mv ./Peakaboo-*.jar ./Packaging/jar/Peakaboo.jar
        mv ./CLI/target/peakaboo-cli-*-packaged.jar ./Packaging/jar/peakaboo-cli.jar
      shell: bash

    - name: Upload Jars
      uses: actions/upload-artifact@v7
      with:
        name: Peakaboo-${{ github.ref_name }}-jars
        path: ./Packaging/jar


  build-deb:

    needs: build-jar
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Download Jars
      uses: actions/download-artifact@v8
      with:
        name: Peakaboo-${{ github.ref_name }}-jars
        path: ./Packaging/jar

    - name: Run JPackage Deb Script
      run: ./build-deb.sh ${{ inputs.release_type }}
      working-directory: ./Packaging

    - name: Smoke Test Packaged CLI
      run: |
        dpkg -x ./Packaging/peakaboo*.deb /tmp/pkgtest
        dpkg -c ./Packaging/peakaboo*.deb
        /tmp/pkgtest/opt/peakaboo*/bin/peakaboo-cli --version
      shell: bash

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Peakaboo-${{ github.ref_name }}.deb
        path: ./Packaging/peakaboo*.deb


  build-rpm:

    needs: build-jar
    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Download Jars
      uses: actions/download-artifact@v8
      with:
        name: Peakaboo-${{ github.ref_name }}-jars
        path: ./Packaging/jar

    - name: Run JPackage RPM Script
      run: ./build-rpm.sh ${{ inputs.release_type }}
      working-directory: ./Packaging

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Peakaboo-${{ github.ref_name }}.rpm
        path: ./Packaging/peakaboo*.rpm


  build-macos-intel:

    needs: build-jar
    runs-on: macos-15-intel

    steps:

    - uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Introspect system
      run: uname -a
      shell: bash

    - name: Introspect jpackage
      run: which jpackage && jpackage --version
      shell: bash

    - name: Download Jars
      uses: actions/download-artifact@v8
      with:
        name: Peakaboo-${{ github.ref_name }}-jars
        path: ./Packaging/jar

    - name: Run JPackage Mac Script
      run: ./build-macos.sh ${{ inputs.release_type }}
      working-directory: ./Packaging

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Peakaboo-${{ github.ref_name }}-Intel.dmg
        path: ./Packaging/Peakaboo*.dmg


  build-macos-m1:

    needs: build-jar
    runs-on: macos-latest

    steps:

    - uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Introspect system
      run: uname -a
      shell: bash

    - name: Introspect jpackage
      run: which jpackage && jpackage --version
      shell: bash

    - name: Download Jars
      uses: actions/download-artifact@v8
      with:
        name: Peakaboo-${{ github.ref_name }}-jars
        path: ./Packaging/jar

    - name: Run JPackage Mac Script
      run: ./build-macos.sh ${{ inputs.release_type }}
      working-directory: ./Packaging

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Peakaboo-${{ github.ref_name }}-M1.dmg
        path: ./Packaging/Peakaboo*.dmg


  # Release builds are signed using Azure Artifact Signing. The launchers live inside the MSI, so
  # they must be signed between building the app image and packaging it, and then the MSI
  # is signed in turn. Dev builds follow the same path but are not signed.
  build-windows:

    needs: build-jar
    runs-on: windows-latest

    # Environment for OIDC integration
    environment: release
    permissions:
      contents: read
      # Required for OIDC token exchange
      id-token: write

    steps:

    - uses: actions/checkout@v6
      with:
        ref: ${{ github.ref }}

    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: 21
        distribution: 'temurin'

    - name: Introspect jpackage
      run: which jpackage.exe && jpackage.exe --version
      shell: bash

    - name: Download Jars
      uses: actions/download-artifact@v8
      with:
        name: Peakaboo-${{ github.ref_name }}-jars
        path: ./Packaging/jar

    - name: Build App Image
      run: ./build-windows-image.bat ${{ inputs.release_type }}
      shell: cmd
      working-directory: ./Packaging

    - name: Azure Login
      if: inputs.release_type == 'release'
      uses: azure/login@v3
      with:
        client-id: ${{ vars.AZURE_CLIENT_ID }}
        tenant-id: ${{ vars.AZURE_TENANT_ID }}
        subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

    # Only the launchers jpackage builds for us; the bundled runtime is Temurin's and keeps
    # their signatures (verify-windows-signatures.ps1 warns if that ever stops being true)
    - name: Sign Launchers
      if: inputs.release_type == 'release'
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        files: |
          ${{ github.workspace }}\Packaging\image\Peakaboo\Peakaboo.exe
          ${{ github.workspace }}\Packaging\image\Peakaboo\peakaboo-cli.exe
        file-digest: SHA256
        # the certificates only live ~3 days, so without a timestamp the signatures would too
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Build Installer
      run: ./build-windows-msi.bat ${{ inputs.release_type }}
      shell: cmd
      working-directory: ./Packaging

    - name: Sign Installer
      if: inputs.release_type == 'release'
      uses: azure/artifact-signing-action@v2
      with:
        endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
        signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
        certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        files-folder: ${{ github.workspace }}\Packaging
        files-folder-filter: msi
        # UAC shows this as the program name for an MSI; without it, users see a temp filename
        description: Peakaboo
        description-url: https://peakaboo.org
        file-digest: SHA256
        timestamp-rfc3161: http://timestamp.acs.microsoft.com
        timestamp-digest: SHA256

    - name: Verify Signatures
      if: inputs.release_type == 'release'
      shell: pwsh
      working-directory: ./Packaging
      run: ./verify-windows-signatures.ps1 (Get-Item Peakaboo*.msi).FullName

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: Peakaboo-${{ github.ref_name }}.msi
        path: ./Packaging/Peakaboo*.msi
